:root {
  color-scheme: only light;
  --ink: #1C2418;
  --muted: rgba(28, 36, 24, .74);
  --green-deep: #3D7413;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100svh;
  display: grid; place-items: center;
  padding: 32px 16px;
  color: var(--ink);
  font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  text-align: center;
  background:
    radial-gradient(58% 30% at 50% 112%, rgba(92, 160, 27, .24) 0%, transparent 70%),
    linear-gradient(to bottom, #ffffff 0%, #FBFCF7 48%, #EFF6E0 100%);
  -webkit-font-smoothing: antialiased;
}
.card { display: grid; justify-items: center; gap: 16px; width: min(30rem, 100%); }
.card img { width: 76px; height: 76px; }
.code { font-weight: 600; font-size: 13px; color: var(--muted); }
h1 { font-family: "Amiri", "Traditional Arabic", serif; font-weight: 700; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.35; }
p[lang="fr"] { font-size: 14px; color: var(--muted); }
a {
  display: inline-block; margin-top: 6px; padding: 12px 24px; border-radius: 999px;
  background: var(--green-deep); color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px;
}
a:hover { background: #2F5C0E; }
a:focus-visible { outline: 2px solid #E30613; outline-offset: 3px; }
